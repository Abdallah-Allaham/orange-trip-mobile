name: Deploy to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What to test / Release notes'
        required: false
        default: 'Executive Cairo 2026 Summit Beta'

jobs:
  testflight_deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Build iOS Archive
        run: |
          echo "DEVELOPMENT_TEAM = 344VMZX925" >> ios/Flutter/Release.xcconfig
          flutter build ipa --release --no-codesign --build-number=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Team string 344VMZX925" build/ios/archive/Runner.xcarchive/Info.plist || /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Team 344VMZX925" build/ios/archive/Runner.xcarchive/Info.plist

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>344VMZX925</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export and Sign IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_ISSUER_ID }}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-trip-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to TestFlight via Altool
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            echo "Uploading build to TestFlight using App Store Connect API Key..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              --apiKey "${{ secrets.APP_STORE_KEY_ID }}" \
              --apiIssuer "${{ secrets.APP_STORE_ISSUER_ID }}" \
              --type ios
            echo "Successfully submitted build to TestFlight!"
          else
            echo "No IPA found in build/ios/ipa, checking xcarchive upload fallback..."
            exit 1
          fi
