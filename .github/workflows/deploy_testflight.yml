name: Deploy to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What to test / Release notes'
        required: false
        default: 'Executive Cairo 2026 Summit Beta'

jobs:
  testflight_deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. سحب الكود
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تفعيل أحدث إصدار Xcode مستقر (مطلوب من Apple لتجاوز خطأ SDK)
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تثبيت المكتبات
      - name: Install Dependencies
        run: flutter pub get

      # 5. تنظيف ملفات بايثون من الـ assets (يحل خطأ generate_icon.py و generate_safe_logo.py)
      - name: Remove python scripts from assets
        run: |
          find assets -name "*.py" -delete || true

      # 6. تشغيل الاختبارات
      - name: Run Tests
        run: flutter test

      # 7. إعداد مفتاح App Store Connect
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      # 8. إنشاء Keychain مؤقت للتوقيع (نفس طريقة dabbirly)
      - name: Setup temporary keychain
        run: |
          security create-keychain -p "temp_build_pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_build_pass" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -s build.keychain $(security list-keychains | tr -d '"')

      # 9. تجهيز كود فلاتر
      - name: Build Flutter iOS
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # 10. Archive مع Xcode والتوقيع التلقائي
      - name: Archive with Xcode
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=344VMZX925 \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_ISSUER_ID }}"

      # 11. تصدير ورفع الحزمة مباشرة إلى TestFlight / App Store Connect
      - name: Export & Upload to TestFlight
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>344VMZX925</string>
            <key>allowProvisioningUpdates</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_ISSUER_ID }}"

      - name: Done!
        run: echo "✅ تم رفع التطبيق بنجاح إلى TestFlight!"
